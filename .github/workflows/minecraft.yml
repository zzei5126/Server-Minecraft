name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept EULA
        run: echo "eula=true" > eula.txt

      - name: Start Server
        run: |
          java -Xms1G -Xmx2G -jar server.jar nogui
